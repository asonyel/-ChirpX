name: Maintain npm lockfile

on:
  push:
    branches: [chirpx-production-foundation-v1]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chirpx-production-foundation-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchronize production npm lockfile"
          git push origin HEAD:chirpx-production-foundation-v1
