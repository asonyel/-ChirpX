name: Maintain npm lockfile

on:
  push:
    branches: [chirpx-production-foundation-v1]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chirpx-production-foundation-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile when missing
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock production npm dependencies"
          git push origin HEAD:chirpx-production-foundation-v1
